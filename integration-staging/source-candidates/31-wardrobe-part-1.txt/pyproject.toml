[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cirvanna"
version = "3.0.0"
description = "Enterprise wardrobe intelligence platform with CLIP perception, graph-based compatibility, and offline sync"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cirvanna Engineering", email = "eng@cirvanna.io" }]
keywords = ["wardrobe", "fashion", "recommendation", "computer-vision", "graph"]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "aio-pika>=9.4.1",
    "neo4j>=5.18.0",
    "qdrant-client>=1.8.2",
    "numpy>=1.26.4",
    "Pillow>=10.2.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "slowapi>=0.1.9",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "celery>=5.3.6",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "aiohttp>=3.9.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "testcontainers[postgres,neo4j,redis,rabbitmq]>=4.4.0",
    "locust>=2.24.1",
    "ruff>=0.4.1",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "chaos: marks chaos engineering tests",
    "slow: marks tests as slow (>5s)",
]

[tool.coverage.run]
source = ["services"]
branch = true
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.per-file-ignores]
"*/migrations/*" = ["E501"]
"*/tests/*" = ["S101", "S105"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
