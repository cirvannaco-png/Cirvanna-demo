name: Release candidate readiness

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full 40-character commit SHA to assess; this workflow does not deploy."
        required: true
        type: string

permissions:
  contents: read

jobs:
  readiness:
    name: Strict release evidence check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Validate candidate SHA
        id: candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$CANDIDATE_SHA"
          echo "Validated exact candidate: $actual_sha"

      - name: Audit source lineage in strict mode
        if: ${{ always() && steps.candidate.outcome == 'success' }}
        run: python scripts/audit_source_lineage.py

      - name: Require every release gate to be passed
        if: ${{ always() && steps.candidate.outcome == 'success' }}
        run: python scripts/validate_release_gates.py --require-all-passed

      - name: Require a real rollback exercise
        if: ${{ always() && steps.candidate.outcome == 'success' }}
        run: python scripts/validate_rollback_evidence.py --require-passed
