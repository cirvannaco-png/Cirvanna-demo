name: Virtual Twin registry checks

on:
  pull_request:
    branches: [main]
    paths:
      - "services/virtual-twin/**"
      - ".github/workflows/virtual-twin-registry.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "engineering/**"
    paths:
      - "services/virtual-twin/**"
      - ".github/workflows/virtual-twin-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-twin-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/virtual-twin/requirements.txt
      - name: Install dependencies
        working-directory: services/virtual-twin
        run: python -m pip install -r requirements.txt
      - name: Run Twin and registry contract tests
        working-directory: services/virtual-twin
        env:
          VIRTUAL_TWIN_API_TOKEN: ci-test-token-long-enough-for-local-check
        run: python -m pytest tests -q
      - name: Build container
        run: docker build -f services/virtual-twin/Dockerfile -t cirvanna-virtual-twin:ci .
