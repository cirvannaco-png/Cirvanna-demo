name: DSI verified capture security pipeline

on:
  push:
    branches: ["main", "feature/**", "engineering/**", "feat/**"]
    paths:
      - "services/vision-intelligence/**"
      - "services/dermalsight/**"
      - "services/identity-learning-service/**"
      - "apps/dsi-android-capture/**"
      - ".github/workflows/dsi-verified-capture.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/vision-intelligence/**"
      - "services/dermalsight/**"
      - "services/identity-learning-service/**"
      - "apps/dsi-android-capture/**"
      - ".github/workflows/dsi-verified-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-key-attestation-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Verify immutable upstream source pin
        working-directory: services/vision-intelligence/attestation-verifier/vendor/android-keyattestation
        run: |
          test "$(git rev-parse HEAD)" = "621149c4ebaeeea844d6f43098687c73c4d370a3"
      - name: Compile verifier and run upstream plus Cirvanna tests
        working-directory: services/vision-intelligence/attestation-verifier
        run: gradle --no-daemon clean build fatJar
      - name: Check verifier artifact
        working-directory: services/vision-intelligence/attestation-verifier
        run: test -s build/libs/dsi-android-attestation-verifier.jar

  vision-verification-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/vision-intelligence
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision-intelligence/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile service and tests
        run: python -m compileall -q app tests
      - name: Run Vision and adversarial capture tests
        run: python -m pytest -q

  dermalsight-capture-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/dermalsight
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DermalSight and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<9" "onnx>=1.16,<2"
      - name: Compile DermalSight and tests
        run: python -m compileall -q app tests
      - name: Run DermalSight receipt and bypass tests
        run: python -m pytest -q tests/test_api.py tests/test_dsi_api.py
