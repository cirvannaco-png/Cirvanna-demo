name: Commerce service checks

on:
  pull_request:
    paths:
      - "services/commerce-service/**"
      - "apps/demo-web/founder-console.html"
      - "apps/demo-web/merchant-portal.html"
      - "apps/demo-web/brand-portal.html"
      - "apps/demo-web/assets/brand-portal.js"
      - "apps/demo-web/marketplace.html"
      - "apps/demo-web/test_portal_contract.py"
      - "apps/demo-web/PORTALS.md"
      - ".github/workflows/commerce-service.yml"
  push:
    branches:
      - main
      - "integration/**"
      - "engineering/**"
      - "feature/**"
    paths:
      - "services/commerce-service/**"
      - "apps/demo-web/founder-console.html"
      - "apps/demo-web/merchant-portal.html"
      - "apps/demo-web/brand-portal.html"
      - "apps/demo-web/assets/brand-portal.js"
      - "apps/demo-web/marketplace.html"
      - "apps/demo-web/test_portal_contract.py"
      - "apps/demo-web/PORTALS.md"
      - ".github/workflows/commerce-service.yml"

permissions:
  contents: read

jobs:
  commerce-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: commerce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commerce_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/commerce-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/commerce-service/requirements.txt
      - name: Install service dependencies
        run: python -m pip install -r requirements.txt
      - name: Provision separate migration, runtime and audit-probe roles
        env:
          PGPASSWORD: postgres_ci
        run: |
          psql -h localhost -U postgres -d commerce_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE commerce_migrator LOGIN PASSWORD 'commerce_migrator_ci';
          ALTER DATABASE commerce_ci OWNER TO commerce_migrator;
          CREATE ROLE commerce_runtime LOGIN PASSWORD 'commerce_runtime_ci';
          CREATE ROLE commerce_audit_probe LOGIN PASSWORD 'commerce_audit_probe_ci';
          GRANT CONNECT ON DATABASE commerce_ci TO commerce_runtime, commerce_audit_probe;
          GRANT USAGE ON SCHEMA public TO commerce_runtime, commerce_audit_probe;
          ALTER DEFAULT PRIVILEGES FOR ROLE commerce_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO commerce_runtime, commerce_audit_probe;
          ALTER DEFAULT PRIVILEGES FOR ROLE commerce_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO commerce_runtime, commerce_audit_probe;
          SQL
      - name: Apply versioned schema migration
        env:
          COMMERCE_DATABASE_URL: sqlite:///./migration-ci.db
          COMMERCE_MIGRATION_DATABASE_URL: sqlite:///./migration-ci.db
          COMMERCE_AUTO_CREATE_SCHEMA: "false"
        run: |
          alembic upgrade 20261109_0007
          alembic upgrade head
          python scripts/verify_cal_purchase_audit_immutability.py
          alembic downgrade 20261109_0007
          alembic upgrade head
      - name: Verify CAL purchase audit immutability on PostgreSQL
        env:
          PGPASSWORD: postgres_ci
          COMMERCE_DATABASE_URL: postgresql+psycopg://commerce_runtime:commerce_runtime_ci@localhost:5432/commerce_ci
          COMMERCE_MIGRATION_DATABASE_URL: postgresql+psycopg://commerce_migrator:commerce_migrator_ci@localhost:5432/commerce_ci
          COMMERCE_ENVIRONMENT: production
          COMMERCE_CAL_AUDIT_PROBE_DATABASE_URL: postgresql+psycopg://commerce_audit_probe:commerce_audit_probe_ci@localhost:5432/commerce_ci
          COMMERCE_AUTO_CREATE_SCHEMA: "false"
        run: |
          alembic upgrade 20261109_0007
          alembic upgrade head
          psql -h localhost -U postgres -d commerce_ci -v ON_ERROR_STOP=1 -c "GRANT TRUNCATE ON TABLE commerce_cal_purchase_audits TO commerce_audit_probe"
          python scripts/verify_cal_purchase_audit_immutability.py
          alembic downgrade 20261109_0007
          alembic upgrade head
          docker run --rm --network host -v /tmp:/backup -e PGPASSWORD=postgres_ci postgres:17 bash -ec 'pg_dump -h 127.0.0.1 -U postgres -d commerce_ci --format=custom -f /backup/cirvanna-commerce.dump && createdb -h 127.0.0.1 -U postgres commerce_restore && pg_restore -h 127.0.0.1 -U postgres -d commerce_restore --exit-on-error /backup/cirvanna-commerce.dump'
          psql -h localhost -U postgres -d commerce_restore -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM alembic_version WHERE version_num='20261121_0016') THEN RAISE EXCEPTION 'Commerce migration head was not restored'; END IF; IF to_regclass('public.commerce_cal_purchase_audits') IS NULL THEN RAISE EXCEPTION 'CAL purchase audit table missing after restore'; END IF; IF (SELECT count(*) FROM pg_trigger WHERE tgname IN ('trg_commerce_cal_purchase_audits_no_update_delete','trg_commerce_cal_purchase_audits_no_truncate') AND NOT tgisinternal) <> 2 THEN RAISE EXCEPTION 'CAL audit UPDATE/DELETE and TRUNCATE triggers missing after restore'; END IF; IF has_table_privilege('commerce_runtime','public.commerce_cal_purchase_audits','TRUNCATE') THEN RAISE EXCEPTION 'Commerce runtime can truncate immutable CAL audit table'; END IF; IF (SELECT pg_get_userbyid(relowner) FROM pg_class WHERE oid='public.commerce_cal_purchase_audits'::regclass) <> 'commerce_migrator' THEN RAISE EXCEPTION 'CAL audit table owner is not migration role'; END IF; END \$\$;"
      - name: Validate model schema compilation
        run: python -m compileall -q app migrations
      - name: Run portal contract tests
        working-directory: .
        run: python -m unittest discover -s apps/demo-web -p 'test_portal_contract.py'
      - name: Check inline marketplace and merchant portal JavaScript syntax
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ("merchant-portal", "marketplace"):
              html = Path(f"apps/demo-web/{name}.html").read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.I | re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {name}.html")
              Path(f"/tmp/cirvanna-{name}.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/cirvanna-merchant-portal.js
          node --check /tmp/cirvanna-marketplace.js
          node --check apps/demo-web/assets/brand-portal.js
      - name: Run commerce API tests
        env:
          COMMERCE_DATABASE_URL: sqlite:///./migration-ci.db
          COMMERCE_AUTO_CREATE_SCHEMA: "true"
        run: python -m pytest tests -q
