name: Commerce to Wardrobe sync worker checks
on:
  push:
    branches: ["main", "feature/**", "feat/**", "engineering/**"]
    paths:
      - "services/sync-service/**"
      - ".github/workflows/sync-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/sync-service/**"
      - ".github/workflows/sync-service.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/sync-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sync-service/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile worker and tests
        run: python -m compileall -q app tests
      - name: Run sync worker tests
        run: python -m pytest -q
