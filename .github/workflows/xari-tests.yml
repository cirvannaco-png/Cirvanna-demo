name: Xari route-contract tests

on:
  push:
    branches: [main, "feature/**", "engineering/**"]
    paths:
      - "services/xari/**"
      - ".github/workflows/xari-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/xari/**"
      - ".github/workflows/xari-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/xari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/xari/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Compile service and tests
        run: python -m compileall -q app xari tests
      - name: Run route-contract tests
        run: python -m pytest -q
