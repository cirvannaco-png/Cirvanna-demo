name: Decision gateway checks

on:
  push:
    branches:
      - main
      - "engineering/**"
      - "feature/**"
    paths:
      - "services/api-gateway/**"
      - "services/recommendation-service/**"
      - "services/virtual-try-on/**"
      - "packages/identity-intelligence/**"
      - "packages/preferences/**"
      - "packages/fit-intelligence/**"
      - ".github/workflows/decision-gateway.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/api-gateway/**"
      - "packages/identity-intelligence/**"
      - "packages/preferences/**"
      - "packages/fit-intelligence/**"
      - ".github/workflows/decision-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api-gateway/requirements.txt
      - name: Install decision gateway dependencies
        working-directory: services/api-gateway
        run: python -m pip install -r requirements.txt
      - name: Run HTTP and decision integration tests
        working-directory: services/api-gateway
        env:
          CIRVANNA_API_TOKEN: ci-test-token
          CIRVANNA_AUDIT_DB: /tmp/cirvanna-ci-audit.sqlite3
        run: python -m pytest tests -q
      - name: Build decision gateway container
        run: docker build -f services/api-gateway/Dockerfile -t cirvanna-decision-gateway:ci .
      - name: Validate architecture invariants
        run: python scripts/validate_architecture.py
      - name: Run domain architecture regression suite
        run: python -m unittest discover -s tests/architecture -v
      - name: Scan for credential patterns
        run: python scripts/scan_source_secrets.py

  virtual-try-on:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/virtual-try-on/requirements.txt
      - name: Install Virtual Try-On dependencies
        working-directory: services/virtual-try-on
        run: python -m pip install -r requirements.txt
      - name: Run Virtual Try-On API and privacy-gate tests
        working-directory: services/virtual-try-on
        env:
          VIRTUAL_TRY_ON_API_TOKEN: ci-test-token
        run: python -m pytest tests -q
      - name: Build Virtual Try-On container
        run: docker build -f services/virtual-try-on/Dockerfile -t cirvanna-virtual-try-on:ci .
