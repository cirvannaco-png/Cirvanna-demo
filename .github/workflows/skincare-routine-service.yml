name: Skincare routine service checks

on:
  push:
    branches: ["main", "feature/**", "engineering/**"]
    paths:
      - "services/skincare-routine-service/**"
      - ".github/workflows/skincare-routine-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/skincare-routine-service/**"
      - ".github/workflows/skincare-routine-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skincare-routine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/skincare-routine-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/skincare-routine-service/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile service and tests
        run: python -m compileall -q app tests
      - name: Run skincare routine tests
        run: python -m pytest -q
      - name: Build service container
        working-directory: .
        run: docker build -f services/skincare-routine-service/Dockerfile -t cirvanna-skincare-routine:test .
