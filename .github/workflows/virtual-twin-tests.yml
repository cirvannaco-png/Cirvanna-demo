name: Virtual Twin API tests

on:
  push:
    branches: ["main", "integration/**"]
    paths:
      - "services/virtual-twin/**"
      - ".github/workflows/virtual-twin-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/virtual-twin/**"
      - ".github/workflows/virtual-twin-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/virtual-twin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/virtual-twin/requirements.txt
      - name: Install service dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Compile service and tests
        run: python -m compileall -q app tests
      - name: Run API contract tests
        run: python -m pytest -q
