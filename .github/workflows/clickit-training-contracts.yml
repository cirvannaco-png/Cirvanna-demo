name: Click It training data contracts

on:
  pull_request:
    paths:
      - "tools/model_training/click_it/**"
      - "tools/model_evaluation/click_it_image_retrieval/**"
      - "tests/model_evaluation/test_click_it_image_retrieval.py"
      - "tools/model_evaluation/fashion_retrieval/data_rights.py"
      - "tests/model_training/**"
      - "tests/model_evaluation/test_data_rights.py"
      - ".github/workflows/clickit-training-contracts.yml"
  push:
    branches: [main, "feat/cvi-foundation-2026-11-27"]
    paths:
      - "tools/model_training/click_it/**"
      - "tools/model_evaluation/click_it_image_retrieval/**"
      - "tests/model_evaluation/test_click_it_image_retrieval.py"
      - "tools/model_evaluation/fashion_retrieval/data_rights.py"
      - "tests/model_training/**"
      - "tests/model_evaluation/test_data_rights.py"
      - ".github/workflows/clickit-training-contracts.yml"

permissions:
  contents: read

jobs:
  dataset-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract test dependencies
        run: python -m pip install --upgrade pip pytest pillow numpy==2.2.6 trimesh==4.7.4 networkx -r services/twin-mesh-validator/requirements.txt
      - name: Compile Click It training tools
        run: python -m compileall -q tools/model_training/click_it
      - name: Run Click It, Look It, rights and CVI contract tests
        run: |
          python -m pytest -q \
            tests/model_training \
            tests/model_evaluation \
            tests/visual_intelligence
      - name: Verify training CLI is import-safe without model weights
        run: python tools/model_training/click_it/train_retrieval.py --help
