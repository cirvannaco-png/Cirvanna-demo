name: DermalSight API

on:
  push:
    paths:
      - "services/dermalsight/**"
      - ".github/workflows/dermalsight.yml"
  pull_request:
    paths:
      - "services/dermalsight/**"
      - ".github/workflows/dermalsight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dermalsight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/dermalsight/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run API and model-contract tests
        run: python -m pytest -q
      - name: Build service container
        run: docker build -t cirvanna-dermalsight:test .
