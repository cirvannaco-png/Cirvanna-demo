name: USI context service tests
on:
  push:
    branches: [main, "feature/**", "engineering/**"]
    paths:
      - "services/usi-context-service/**"
      - ".github/workflows/usi-context-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/usi-context-service/**"
      - ".github/workflows/usi-context-service.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  usi-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/usi-context-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/usi-context-service/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile service and tests
        run: python -m compileall -q app tests
      - name: Run persistence and ownership tests
        run: python -m pytest -q
