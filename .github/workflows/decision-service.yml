name: Decision service checks

on:
  pull_request:
    paths:
      - "services/decision-service/**"
      - "packages/identity-intelligence/catacaci/**"
      - "packages/identity-intelligence/eepl/**"
      - "packages/identity-intelligence/usi/**"
      - "packages/preferences/npl/**"
      - "packages/fit-intelligence/fci/**"
      - ".github/workflows/decision-service.yml"
  push:
    branches: [main]
    paths:
      - "services/decision-service/**"
      - "packages/identity-intelligence/catacaci/**"
      - "packages/identity-intelligence/eepl/**"
      - "packages/identity-intelligence/usi/**"
      - "packages/preferences/npl/**"
      - "packages/fit-intelligence/fci/**"
      - ".github/workflows/decision-service.yml"

permissions:
  contents: read

jobs:
  decision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: decision-ci-secret
          POSTGRES_DB: decision_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d decision_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/decision-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply and adversarially verify decision audit migrations on PostgreSQL 17
        env:
          PGPASSWORD: decision-ci-secret
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: decision_ci
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cirvanna_decision_audit_schema_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE cirvanna_decision_audit NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE decision_audit_probe NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          GRANT CREATE ON DATABASE decision_ci TO cirvanna_decision_audit_schema_owner;
          SET ROLE cirvanna_decision_audit_schema_owner;
          \i migrations/0001_catacaci_decision_receipts.sql
          \i migrations/0002_catacaci_governance_store.sql
          RESET ROLE;
          SQL
          psql -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA decision_private TO decision_audit_probe"
          psql -v ON_ERROR_STOP=1 -c "GRANT UPDATE, DELETE ON decision_private.catacaci_decision_receipts TO decision_audit_probe"
          psql -v ON_ERROR_STOP=1 -c "SET ROLE cirvanna_decision_audit; INSERT INTO decision_private.catacaci_decision_receipts (receipt_id,request_id,candidate_id,verdict,may_display,eepl_policy_id,eepl_policy_version,cal_policy_id,cal_policy_version,minimum_fit_confidence,maximum_fit_confidence_disagreement,arbitration_contract_version,pipeline_contract_version,candidate_snapshot_sha256,catalog_version,evaluated_signals,reasons,receipt_sha256,created_at) VALUES (gen_random_uuid(),'ci-migration-probe','ci-candidate','REVIEW',false,'eepl-ci','1','cal-ci','1',0.70,0.10,'ci-arbitration-v1','ci-pipeline-v1',repeat('a',64),1,'{}'::jsonb,'[]'::jsonb,repeat('b',64),now()); RESET ROLE"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE decision_audit_probe;
          DO $
          BEGIN
            BEGIN
              UPDATE decision_private.catacaci_decision_receipts SET verdict='BLOCK' WHERE request_id='ci-migration-probe';
              RAISE EXCEPTION 'append-only UPDATE unexpectedly succeeded';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              RAISE NOTICE 'append-only UPDATE correctly blocked';
            END;
            BEGIN
              DELETE FROM decision_private.catacaci_decision_receipts WHERE request_id='ci-migration-probe';
              RAISE EXCEPTION 'append-only DELETE unexpectedly succeeded';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              RAISE NOTICE 'append-only DELETE correctly blocked';
            END;
          END
          $;
          RESET ROLE;
          SQL
          psql -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN has_table_privilege('cirvanna_decision_audit','decision_private.catacaci_decision_receipts','SELECT') AND has_table_privilege('cirvanna_decision_audit','decision_private.catacaci_decision_receipts','INSERT') AND NOT has_table_privilege('cirvanna_decision_audit','decision_private.catacaci_decision_receipts','UPDATE') AND NOT has_table_privilege('cirvanna_decision_audit','decision_private.catacaci_decision_receipts','DELETE') AND NOT has_table_privilege('cirvanna_decision_audit','decision_private.catacaci_decision_receipts','TRUNCATE') AND NOT has_schema_privilege('cirvanna_decision_audit','decision_private','CREATE') THEN 'least-privilege-ok' ELSE (1/0)::text END"
      - name: Run decision API contract tests
        env:
          DECISION_SERVICE_TOKEN: decision-service-ci-token-minimum-32-bytes
          FCI_EVIDENCE_HMAC_SECRET: fci-evidence-ci-secret-minimum-32-bytes
          NPL_EVIDENCE_HMAC_SECRET: npl-evidence-ci-secret-minimum-32-bytes
          CULTURAL_IDENTITY_HMAC_SECRET: cultural-evidence-ci-secret-minimum-32-bytes
        run: python -m pytest tests -q
      - name: Compile service and referenced domain packages
        run: python -m compileall -q app ../../packages/identity-intelligence ../../packages/preferences ../../packages/fit-intelligence
