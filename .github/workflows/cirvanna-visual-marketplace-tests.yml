name: Twin, Vision, Catalog and PNELLY contract tests (Xari compatibility)

on:
  push:
    branches: [main, "feature/**", "integration/**", "engineering/**"]
    paths:
      - "services/virtual-twin/**"
      - "services/vision-intelligence/**"
      - "services/catalog-service/**"
      - "services/xari/**"
      - ".github/workflows/cirvanna-visual-marketplace-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/virtual-twin/**"
      - "services/vision-intelligence/**"
      - "services/catalog-service/**"
      - "services/xari/**"
      - ".github/workflows/cirvanna-visual-marketplace-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - virtual-twin
          - vision-intelligence
          - catalog-service
          - xari
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install service dependencies
        run: |
          if [ "${{ matrix.service }}" = "vision-intelligence" ]; then
            python -m pip install -r requirements-test.txt
          else
            python -m pip install -r requirements.txt
          fi
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile service and tests
        run: |
          if [ -d xari ]; then python -m compileall -q app xari tests; else python -m compileall -q app tests; fi
      - name: Run complete service test suite
        run: python -m pytest -q
