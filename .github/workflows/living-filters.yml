name: Living Filters validation

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/living-filters/**"
      - ".github/workflows/living-filters.yml"
      - "docs/architecture/adr/ADR-0002-living-filters-landmark-provider.md"
  push:
    branches:
      - main
      - "feature/living-filters-mvp"
    paths:
      - "apps/living-filters/**"
      - ".github/workflows/living-filters.yml"
      - "docs/architecture/adr/ADR-0002-living-filters-landmark-provider.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-filters-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-vision:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check apps/living-filters/src/app.mjs
          node --check apps/living-filters/src/filter-catalog.mjs
          node --check apps/living-filters/src/request-epoch.mjs
          node --check apps/living-filters/src/landmark-frame-contract.mjs
          node --check apps/living-filters/src/face-renderer.mjs
          node --check apps/living-filters/src/vision-worker.mjs
          node --check apps/living-filters/scripts/prepare-vision-assets.mjs
          node --check apps/living-filters/scripts/verify-vision-assets.mjs
          node --check apps/living-filters/scripts/browser-smoke.mjs

      - name: Run unit and boundary contract tests
        run: node --test apps/living-filters/tests/*.test.mjs

      - name: Prepare pinned local runtime, WASM and model assets
        run: node apps/living-filters/scripts/prepare-vision-assets.mjs

      - name: Install pinned browser and bundler tools
        working-directory: apps/living-filters
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0 esbuild@0.28.2

      - name: Build classic local vision worker bundle
        working-directory: apps/living-filters
        run: |
          npx --no-install esbuild src/vision-worker.mjs --bundle --platform=browser --format=iife --target=es2022 --outfile=src/vision-worker.bundle.js
          node --check src/vision-worker.bundle.js

      - name: Verify local asset hashes, licences, CSP and worker bundle
        run: node apps/living-filters/scripts/verify-vision-assets.mjs

      - name: Install Chromium
        working-directory: apps/living-filters
        run: npx playwright install --with-deps chromium

      - name: Run local-only browser/model smoke test
        working-directory: apps/living-filters
        run: node scripts/browser-smoke.mjs

      - name: Archive prepared local runtime and models
        if: always() && hashFiles('apps/living-filters/vendor/mediapipe/assets-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: living-filters-prepared-runtime
          path: |
            apps/living-filters/vendor/mediapipe/
            apps/living-filters/models/
            apps/living-filters/src/vision-worker.bundle.js
          retention-days: 30
