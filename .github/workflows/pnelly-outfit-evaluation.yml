name: PNELLY Outfit Evaluation

on:
  push:
    branches: ["main", "feat/**", "feature/**"]
    paths:
      - "scripts/evaluation/**"
      - "data/evaluation/**"
      - "apps/demo-web/outfit-review.html"
      - ".github/workflows/pnelly-outfit-evaluation.yml"
  pull_request:
    paths:
      - "scripts/evaluation/**"
      - "data/evaluation/**"
      - "apps/demo-web/outfit-review.html"
      - ".github/workflows/pnelly-outfit-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pnelly-outfit-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluation test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Validate JSON Schema syntax
        run: python -m json.tool data/evaluation/outfit-review.schema.json > /dev/null
      - name: Compile evaluation tools
        run: |
          python -m py_compile \
            scripts/evaluation/evaluate_outfits.py \
            scripts/evaluation/prepare_pnelly_cases.py \
            scripts/evaluation/evaluate_pnelly_cases.py
      - name: Run benchmark and trace-handoff tests
        run: |
          python -m pytest -q \
            scripts/evaluation/test_evaluate_outfits.py \
            scripts/evaluation/test_prepare_pnelly_cases.py \
            scripts/evaluation/test_evaluate_pnelly_cases.py
