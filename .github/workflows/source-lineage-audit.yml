name: Source lineage strict audit

on:
  pull_request:
    paths:
      - "scripts/audit_source_lineage.py"
      - "integration-staging/**"
      - "docs/migration/source-*-lineage-*.csv"
      - ".github/workflows/source-lineage-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-source-lineage:
    name: Archive, snapshot and candidate provenance (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run strict lineage audit (unreconciled differences fail)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p audit-artifacts
          python scripts/audit_source_lineage.py 2>&1 | tee audit-artifacts/source-lineage-audit.txt

      - name: Preserve strict audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirvanna-source-lineage-audit
          path: audit-artifacts/source-lineage-audit.txt
          if-no-files-found: warn
          retention-days: 30
