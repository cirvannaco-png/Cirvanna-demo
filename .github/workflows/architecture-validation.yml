name: Architecture validation

on:
  push:
    branches:
      - main
      - "architecture/**"
      - "integration/**"
      - "migration/**"
      - "governance/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate ownership and source inventory
        run: python scripts/validate_architecture.py
      - name: Audit archive and candidate integrity; report unresolved source mappings
        run: python scripts/audit_source_lineage.py --allow-unreconciled
      - name: Verify file-level code-snippet inventory
        run: python scripts/build_code_snippet_inventory.py --check
      - name: Validate canonical source import boundaries
        run: python scripts/validate_source_boundaries.py
      - name: Validate canonical deployment inventory
        run: python scripts/validate_canonical_stack.py
      - name: Validate production release gate registry
        run: python scripts/validate_release_gates.py
      - name: Run architecture tests
        run: python -m unittest discover -s tests/architecture -v
      - name: Audit source for credential patterns
        run: python scripts/scan_source_secrets.py
