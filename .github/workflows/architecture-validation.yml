name: Architecture validation

on:
  push:
    branches:
      - main
      - "architecture/**"
      - "integration/**"
      - "migration/**"
      - "feature/pamasmma-cognitive-brand-auth"
  pull_request:
    branches:
      - main
      - "integration/source-reconstruction"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Python and architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://cirvanna_test:cirvanna_test@localhost:5432/cirvanna_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cirvanna_test
          POSTGRES_PASSWORD: cirvanna_test
          POSTGRES_DB: cirvanna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cirvanna_test -d cirvanna_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2,<3" "fastapi>=0.104,<1" "python-jose[cryptography]>=3.3,<4" "asyncpg>=0.29,<1" pytest
      - name: Compile Python sources and tests
        run: python -m compileall -q services/cognitive-orchestration services/brand-partner-api tests/test_cognitive_orchestration_contracts.py tests/test_cognitive_handlers.py tests/test_brand_token_security.py tests/test_brand_account_service.py tests/test_brand_postgres_integration.py
      - name: Validate ownership and source inventory
        run: python scripts/validate_architecture.py
      - name: Run architecture tests
        run: python -m unittest discover -s tests/architecture -v
      - name: Run cognitive and brand-auth unit tests
        run: python -m pytest -q tests/test_cognitive_orchestration_contracts.py tests/test_cognitive_handlers.py tests/test_brand_token_security.py tests/test_brand_account_service.py
      - name: Run PostgreSQL persistence integration test
        run: python -m pytest -q -vv tests/test_brand_postgres_integration.py
      - name: Audit source for credential patterns
        run: python scripts/scan_source_secrets.py
