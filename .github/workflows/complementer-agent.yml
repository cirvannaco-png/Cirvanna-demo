name: Complementer agent checks
on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "services/recommendation-service/**"
      - ".github/workflows/complementer-agent.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/recommendation-service/**"
      - ".github/workflows/complementer-agent.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complementer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/recommendation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/recommendation-service/requirements.txt
      - name: Install service dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile service and tests
        run: python -m compileall -q app tests
      - name: Run Complementer contract tests
        run: python -m pytest -q
