name: Private asset and Virtual Try-On checks

on:
  push:
    branches:
      - main
      - "feature/**"
      - "engineering/**"
    paths:
      - "services/virtual-try-on/**"
      - "services/asset-service/**"
      - ".github/workflows/virtual-try-on.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/virtual-try-on/**"
      - "services/asset-service/**"
      - ".github/workflows/virtual-try-on.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cirvanna_test
          POSTGRES_PASSWORD: test-secret-assets
          POSTGRES_DB: cirvanna_assets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cirvanna_test -d cirvanna_assets"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/asset-service/requirements.txt
      - name: Install dependencies
        working-directory: services/asset-service
        run: python -m pip install -r requirements.txt
      - name: Run private asset API and lifecycle tests
        working-directory: services/asset-service
        run: python -m pytest tests -q
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply asset migrations to PostgreSQL and verify fail-closed defaults
        working-directory: services/asset-service
        env:
          PGPASSWORD: test-secret-assets
        run: |
          psql -h localhost -U cirvanna_test -d cirvanna_assets -v ON_ERROR_STOP=1 -f migrations/0001_asset_objects.sql
          psql -h localhost -U cirvanna_test -d cirvanna_assets -v ON_ERROR_STOP=1 -c "INSERT INTO asset_objects (asset_id, owner_user_id, purpose, parent_id, object_key, content_type, byte_size, sha256, status) VALUES ('00000000-0000-4000-8000-000000000001','subject-001','appearance_source_image','look-001','private/test/source.png','image/png',128,'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa','active')"
          psql -h localhost -U cirvanna_test -d cirvanna_assets -v ON_ERROR_STOP=1 -c "INSERT INTO asset_objects (asset_id, owner_user_id, purpose, parent_id, object_key, content_type, byte_size, sha256, status) VALUES ('00000000-0000-4000-8000-000000000002','subject-001','twin_representation','twin-001','private/test/twin.glb','model/gltf-binary',256,'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb','active')"
          psql -h localhost -U cirvanna_test -d cirvanna_assets -v ON_ERROR_STOP=1 -f migrations/0002_asset_lifecycle_provenance.sql
          psql -h localhost -U cirvanna_test -d cirvanna_assets -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM asset_objects WHERE asset_id='00000000-0000-4000-8000-000000000001' AND asset_role='unclassified' AND publication_scope='private_only' AND publication_state='private_only') THEN RAISE EXCEPTION 'legacy asset did not receive fail-closed defaults'; END IF; END \$\$;"
          if psql -h localhost -U cirvanna_test -d cirvanna_assets -v ON_ERROR_STOP=1 -c "UPDATE asset_objects SET publication_scope='approved_public', publication_state='approved' WHERE asset_id='00000000-0000-4000-8000-000000000001'"; then
            echo "ERROR: personal media was approved without consent and masking evidence"
            exit 1
          else
            echo "Expected rejection: personal media cannot be approved without consent and masking evidence"
          fi
          if psql -h localhost -U cirvanna_test -d cirvanna_assets -v ON_ERROR_STOP=1 -c "UPDATE asset_objects SET consent_receipt_id='consent-test-001', consent_version='click-it-v1', masking_attestation_id='masking-test-001', masking_model_sha256='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', human_privacy_review_receipt_id='human-review-test-001', human_privacy_reviewer_ref='reviewer-ref-001', human_privacy_reviewed_at=now(), publication_scope='approved_public', publication_state='approved' WHERE asset_id='00000000-0000-4000-8000-000000000001'"; then
            echo "ERROR: publication was approved without a destination surface"
            exit 1
          else
            echo "Expected rejection: approved publication requires an exact destination surface"
          fi
          if psql -h localhost -U cirvanna_test -d cirvanna_assets -v ON_ERROR_STOP=1 -c "UPDATE asset_objects SET consent_receipt_id='consent-mesh-001', consent_version='click-it-v1', masking_attestation_id='masking-mesh-001', masking_model_sha256='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', human_privacy_review_receipt_id='human-review-mesh-001', human_privacy_reviewer_ref='reviewer-ref-mesh', human_privacy_reviewed_at=now(), publication_scope='approved_public', publication_state='approved', publication_surface='shared_link' WHERE asset_id='00000000-0000-4000-8000-000000000002'"; then
            echo "ERROR: Twin mesh representation was approved for public publication"
            exit 1
          else
            echo "Expected rejection: Twin mesh representations remain private"
          fi
          psql -h localhost -U cirvanna_test -d cirvanna_assets -v ON_ERROR_STOP=1 -c "UPDATE asset_objects SET consent_receipt_id='consent-test-001', consent_version='click-it-v1', masking_attestation_id='masking-test-001', masking_model_sha256='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', human_privacy_review_receipt_id='human-review-test-001', human_privacy_reviewer_ref='reviewer-ref-001', human_privacy_reviewed_at=now(), publication_scope='approved_public', publication_state='approved', publication_surface='shared_link' WHERE asset_id='00000000-0000-4000-8000-000000000001'"
      - name: Verify asset PostgreSQL dump and isolated restore
        working-directory: .
        env:
          PGPASSWORD: test-secret-assets
        run: |
          docker run --rm --network host -v /tmp:/backup -e PGPASSWORD=test-secret-assets postgres:17 bash -ec 'pg_dump -h 127.0.0.1 -U cirvanna_test -d cirvanna_assets --format=custom -f /backup/cirvanna-assets.dump && createdb -h 127.0.0.1 -U cirvanna_test asset_restore && pg_restore -h 127.0.0.1 -U cirvanna_test -d asset_restore --exit-on-error /backup/cirvanna-assets.dump'
          psql -h localhost -U cirvanna_test -d asset_restore -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM asset_objects WHERE asset_id='00000000-0000-4000-8000-000000000001' AND publication_state='approved' AND publication_surface='shared_link' AND masking_attestation_id='masking-test-001') THEN RAISE EXCEPTION 'approved asset provenance missing after restore'; END IF; IF NOT EXISTS (SELECT 1 FROM asset_objects WHERE asset_id='00000000-0000-4000-8000-000000000002' AND publication_scope='private_only' AND publication_state='private_only') THEN RAISE EXCEPTION 'Twin mesh private default missing after restore'; END IF; END \$\$;"
      - name: Build private asset service container
        run: docker build -f services/asset-service/Dockerfile -t cirvanna-asset-service:ci .

  virtual-try-on:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/virtual-try-on/requirements.txt
      - name: Install dependencies
        working-directory: services/virtual-try-on
        run: python -m pip install -r requirements.txt
      - name: Run API contract and privacy-gate tests
        working-directory: services/virtual-try-on
        env:
          VIRTUAL_TRY_ON_API_TOKEN: ci-test-token
        run: python -m pytest tests -q
      - name: Install GPU worker contract-test dependencies
        run: python -m pip install -r services/virtual-try-on/model-worker/requirements.txt
      - name: Run private GPU worker contract tests
        working-directory: services/virtual-try-on/model-worker
        run: python -m pytest tests -q
      - name: Build orchestration container
        run: docker build -f services/virtual-try-on/Dockerfile -t cirvanna-virtual-try-on:ci .
