name: Private asset and Virtual Try-On checks

on:
  push:
    branches:
      - main
      - "feature/**"
      - "engineering/**"
    paths:
      - "services/virtual-try-on/**"
      - "services/asset-service/**"
      - ".github/workflows/virtual-try-on.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/virtual-try-on/**"
      - "services/asset-service/**"
      - ".github/workflows/virtual-try-on.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/asset-service/requirements.txt
      - name: Install dependencies
        working-directory: services/asset-service
        run: python -m pip install -r requirements.txt
      - name: Run private asset API and lifecycle tests
        working-directory: services/asset-service
        run: python -m pytest tests -q
      - name: Build private asset service container
        run: docker build -f services/asset-service/Dockerfile -t cirvanna-asset-service:ci .

  virtual-try-on:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/virtual-try-on/requirements.txt
      - name: Install dependencies
        working-directory: services/virtual-try-on
        run: python -m pip install -r requirements.txt
      - name: Run API contract and privacy-gate tests
        working-directory: services/virtual-try-on
        env:
          VIRTUAL_TRY_ON_API_TOKEN: ci-test-token
        run: python -m pytest tests -q
      - name: Install GPU worker contract-test dependencies
        run: python -m pip install -r services/virtual-try-on/model-worker/requirements.txt
      - name: Run private GPU worker contract tests
        working-directory: services/virtual-try-on/model-worker
        run: python -m pytest tests -q
      - name: Build orchestration container
        run: docker build -f services/virtual-try-on/Dockerfile -t cirvanna-virtual-try-on:ci .
