name: Virtual Try-On and Living Filters checks

on:
  push:
    branches:
      - main
      - "feature/**"
      - "engineering/**"
    paths:
      - "services/virtual-try-on/**"
      - "apps/living-filters/**"
      - ".github/workflows/virtual-try-on.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/virtual-try-on/**"
      - "apps/living-filters/**"
      - ".github/workflows/virtual-try-on.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-try-on:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/virtual-try-on/requirements.txt
      - name: Install dependencies
        working-directory: services/virtual-try-on
        run: python -m pip install -r requirements.txt
      - name: Run API contract and privacy-gate tests
        working-directory: services/virtual-try-on
        env:
          VIRTUAL_TRY_ON_API_TOKEN: ci-test-token
        run: python -m pytest tests -q
      - name: Build container
        run: docker build -f services/virtual-try-on/Dockerfile -t cirvanna-virtual-try-on:ci .
      - name: Set up Node.js for Living Filters
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Living Filters JavaScript syntax
        run: node --check apps/living-filters/src/app.mjs && node --check apps/living-filters/src/filter-catalog.mjs
      - name: Run Living Filters catalogue contract tests
        run: node --test apps/living-filters/tests/*.test.mjs
