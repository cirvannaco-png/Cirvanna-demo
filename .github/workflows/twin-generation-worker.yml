name: Twin generation worker contract tests

on:
  pull_request:
    paths:
      - "services/twin-generation-worker/**"
      - "docs/architecture/**"
      - "docs/research/**"
  push:
    branches: [main]
    paths:
      - "services/twin-generation-worker/**"
      - "docs/architecture/**"
      - "docs/research/**"

permissions:
  contents: read

jobs:
  worker-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/twin-generation-worker/requirements-contract.txt
            services/twin-generation-worker/requirements-test.txt
      - name: Install worker contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/twin-generation-worker/requirements-contract.txt
          python -m pip install -r services/twin-generation-worker/requirements-test.txt
      - name: Run worker contract tests
        working-directory: services/twin-generation-worker
        run: pytest -q
      - name: Compile worker source
        run: python -m compileall -q services/twin-generation-worker/app services/twin-generation-worker/scripts
