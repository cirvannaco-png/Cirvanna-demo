name: Outfit evaluation contract

on:
  pull_request:
    paths:
      - "scripts/evaluation/**"
      - "data/evaluation/**"
      - "docs/evaluation/**"
      - ".github/workflows/outfit-evaluation-contract.yml"
  push:
    branches: [main]
    paths:
      - "scripts/evaluation/**"
      - "data/evaluation/**"
      - "docs/evaluation/**"
      - ".github/workflows/outfit-evaluation-contract.yml"

permissions:
  contents: read

jobs:
  evaluator-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run evaluator contract tests
        run: python -m unittest discover -s scripts/evaluation -p 'test_*.py' -v
