name: Container image builds

on:
  pull_request:
    paths:
      - "services/catalog-service/**"
      - "services/commerce-service/**"
      - "services/decision-service/**"
      - "services/marketplace-bff/**"
      - "services/asset-service/**"
      - "services/appearance-intelligence-service/**"
      - "packages/appearance_intelligence/**"
      - "services/privacy-governance-service/**"
      - "services/intelligence-service/**"
      - "services/identity-learning-service/**"
      - "services/vision-intelligence/**"
      - "packages/identity-intelligence/age_evidence/**"
      - "services/api-gateway/**"
      - "services/dermalsight/**"
      - "services/twin-mesh-validator/**"
      - "services/twin-registry/**"
      - "services/virtual-try-on/**"
      - "services/virtual-twin/**"
      - "services/skincare-routine-service/**"
      - "render.yaml"
      - ".github/workflows/container-image-builds.yml"
  push:
    branches: [main]
    paths:
      - "services/catalog-service/**"
      - "services/commerce-service/**"
      - "services/decision-service/**"
      - "services/marketplace-bff/**"
      - "services/asset-service/**"
      - "services/appearance-intelligence-service/**"
      - "services/vision-intelligence/**"
      - "services/privacy-governance-service/**"
      - "services/intelligence-service/**"
      - "services/identity-learning-service/**"
      - "services/api-gateway/**"
      - "services/dermalsight/**"
      - "services/twin-mesh-validator/**"
      - "services/twin-registry/**"
      - "services/virtual-try-on/**"
      - "services/virtual-twin/**"
      - "services/skincare-routine-service/**"
      - ".github/workflows/container-image-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Catalog service image
        run: docker build -f services/catalog-service/Dockerfile -t cirvanna-catalog:ci services/catalog-service
      - name: Build Commerce service image
        run: docker build -f services/commerce-service/Dockerfile -t cirvanna-commerce:ci services/commerce-service
      - name: Build internal Decision service image
        run: docker build -f services/decision-service/Dockerfile -t cirvanna-decision:ci .
      - name: Build Marketplace BFF image
        run: docker build -f services/marketplace-bff/Dockerfile -t cirvanna-marketplace-bff:ci .
      - name: Build private Asset service image
        run: docker build -f services/asset-service/Dockerfile -t cirvanna-asset-service:ci .
      - name: Build private Appearance Intelligence service image
        run: docker build -f services/appearance-intelligence-service/Dockerfile -t cirvanna-appearance-intelligence:ci .
      - name: Build Vision Intelligence image
        run: docker build -f services/vision-intelligence/Dockerfile -t cirvanna-vision-intelligence:ci services/vision-intelligence
      - name: Build Privacy Governance service image
        run: docker build -f services/privacy-governance-service/Dockerfile -t cirvanna-privacy-governance:ci services/privacy-governance-service
      - name: Build Cirvanna Intelligence Service image
        run: docker build -f services/intelligence-service/Dockerfile -t cirvanna-intelligence:ci services/intelligence-service
      - name: Build Identity Learning service image
        run: docker build -f services/identity-learning-service/Dockerfile -t cirvanna-identity-learning:ci .
      - name: Build API Gateway image
        run: docker build -f services/api-gateway/Dockerfile -t cirvanna-api-gateway:ci .
      - name: Build DermalSight service image
        run: docker build -f services/dermalsight/Dockerfile -t cirvanna-dermalsight:ci services/dermalsight
      - name: Build Twin Mesh Validator image
        run: docker build -f services/twin-mesh-validator/Dockerfile -t cirvanna-twin-mesh-validator:ci services/twin-mesh-validator
      - name: Build Twin Registry image
        run: docker build -f services/twin-registry/Dockerfile -t cirvanna-twin-registry:ci .
      - name: Build Virtual Try-On API image
        run: docker build -f services/virtual-try-on/Dockerfile -t cirvanna-virtual-try-on:ci .
      - name: Build Virtual Twin image
        run: docker build -f services/virtual-twin/Dockerfile -t cirvanna-virtual-twin:ci services/virtual-twin
      - name: Build Skincare Routine service image
        run: docker build -f services/skincare-routine-service/Dockerfile -t cirvanna-skincare-routine:ci .

      # The FASHN model worker is a separately qualified GPU workload. It is
      # intentionally not deployed to Render's CPU service fleet; its pinned
      # source and model-weight/licence/runtime qualification is tracked separately.

      - name: Record exact-candidate local image IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          {
            echo "candidate_commit=${GITHUB_SHA}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for image in \
              cirvanna-catalog:ci \
              cirvanna-commerce:ci \
              cirvanna-decision:ci \
              cirvanna-marketplace-bff:ci \
              cirvanna-asset-service:ci \
              cirvanna-appearance-intelligence:ci \
              cirvanna-vision-intelligence:ci \
              cirvanna-privacy-governance:ci \
              cirvanna-intelligence:ci \
              cirvanna-identity-learning:ci \
              cirvanna-api-gateway:ci \
              cirvanna-dermalsight:ci \
              cirvanna-twin-mesh-validator:ci \
              cirvanna-twin-registry:ci \
              cirvanna-virtual-try-on:ci \
              cirvanna-virtual-twin:ci \
              cirvanna-skincare-routine:ci; do
              printf '%s ' "${image}"
              docker image inspect --format '{{.Id}}' "${image}"
            done
          } | tee audit-artifacts/container-image-local-ids.txt

      - name: Preserve container build manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirvanna-container-image-local-ids
          path: audit-artifacts/container-image-local-ids.txt
          if-no-files-found: warn
          retention-days: 30
