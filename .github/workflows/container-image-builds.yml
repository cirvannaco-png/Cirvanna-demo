name: Container image builds

on:
  pull_request:
    paths:
      - "services/catalog-service/**"
      - "services/commerce-service/**"
      - "services/decision-service/**"
      - "services/marketplace-bff/**"
      - "services/asset-service/**"
      - "services/privacy-governance-service/**"
      - "services/intelligence-service/**"
      - "services/api-gateway/**"
      - ".github/workflows/container-image-builds.yml"
  push:
    branches: [main]
    paths:
      - "services/catalog-service/**"
      - "services/commerce-service/**"
      - "services/decision-service/**"
      - "services/marketplace-bff/**"
      - "services/asset-service/**"
      - "services/vision-intelligence/**"
      - "services/privacy-governance-service/**"
      - "services/intelligence-service/**"
      - ".github/workflows/container-image-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Catalog service image
        run: docker build -f services/catalog-service/Dockerfile -t cirvanna-catalog:ci services/catalog-service
      - name: Build Commerce service image
        run: docker build -f services/commerce-service/Dockerfile -t cirvanna-commerce:ci services/commerce-service
      - name: Build internal Decision service image
        run: docker build -f services/decision-service/Dockerfile -t cirvanna-decision:ci .
      - name: Build Marketplace BFF image
        run: docker build -f services/marketplace-bff/Dockerfile -t cirvanna-marketplace-bff:ci .
      - name: Build private Asset service image
        run: docker build -f services/asset-service/Dockerfile -t cirvanna-asset-service:ci .
      - name: Build Vision Intelligence image
        run: docker build -f services/vision-intelligence/Dockerfile -t cirvanna-vision-intelligence:ci services/vision-intelligence
      - name: Build Privacy Governance service image
        run: docker build -f services/privacy-governance-service/Dockerfile -t cirvanna-privacy-governance:ci services/privacy-governance-service
      - name: Build Cirvanna Intelligence Service image
        run: docker build -f services/intelligence-service/Dockerfile -t cirvanna-intelligence:ci services/intelligence-service
      - name: Build API Gateway image
        run: docker build -f services/api-gateway/Dockerfile -t cirvanna-api-gateway:ci .
