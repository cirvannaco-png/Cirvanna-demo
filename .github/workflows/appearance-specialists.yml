name: Appearance specialist contract tests

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/appearance-intelligence/**"
      - "packages/identity-intelligence/catacaci/core.py"
      - "packages/preferences/npl/**"
      - "services/appearance-orchestrator/**"
      - "tests/appearance_intelligence/**"
      - "tests/architecture/test_appearance_pipeline.py"
      - "docs/product/specialist-capability-audit.md"
      - ".github/workflows/appearance-specialists.yml"
  push:
    branches: [main, "feature/specialist-ecosystem-foundation"]
    paths:
      - "packages/appearance-intelligence/**"
      - "packages/identity-intelligence/catacaci/core.py"
      - "packages/preferences/npl/**"
      - "services/appearance-orchestrator/**"
      - "tests/appearance_intelligence/**"
      - "tests/architecture/test_appearance_pipeline.py"
      - "docs/product/specialist-capability-audit.md"
      - ".github/workflows/appearance-specialists.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specialist-contracts:
    name: Run appearance specialist contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: packages/appearance-intelligence:packages/identity-intelligence:packages/preferences:services/appearance-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test/runtime adapter dependency
        run: python -m pip install -r services/appearance-orchestrator/requirements.txt "pytest>=8,<9"
      - name: Compile implementation and tests
        run: python -m compileall -q packages/appearance-intelligence/appearance_intelligence services/appearance-orchestrator tests/appearance_intelligence
      - name: Run specialist integration and contract tests
        run: python -m pytest tests/appearance_intelligence -q
      - name: Run canonical CAL regression tests
        run: python -m pytest tests/architecture/test_catacaci_core.py -q
