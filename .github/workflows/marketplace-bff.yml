name: Marketplace BFF checks

on:
  pull_request:
    paths:
      - "services/marketplace-bff/**"
      - "packages/http_observability/**"
      - "apps/demo-web/marketplace.html"
      - "apps/demo-web/wardrobe.html"
      - "apps/demo-web/test_wardrobe_style_profile.py"
      - "apps/demo-web/marketplace.html"
      - "apps/demo-web/merchant-portal.html"
      - "apps/demo-web/assets/appearance-workspace.js"
      - "apps/demo-web/sanctuary.html"
      - "apps/demo-web/twin-onboarding.html"
      - "apps/demo-web/assets/cirvanna-sanctuary.css"
      - "apps/demo-web/assets/cirvanna-sanctuary.js"
      - "apps/demo-web/assets/cirvanna-twin-onboarding.css"
      - "apps/demo-web/assets/cirvanna-twin-onboarding.js"
      - ".github/workflows/marketplace-bff.yml"
  push:
    branches:
      - main
      - "integration/**"
      - "engineering/**"
      - "feature/**"
    paths:
      - "services/marketplace-bff/**"
      - "packages/http_observability/**"
      - "apps/demo-web/marketplace.html"
      - "apps/demo-web/wardrobe.html"
      - "apps/demo-web/assets/appearance-workspace.js"
      - "apps/demo-web/sanctuary.html"
      - "apps/demo-web/twin-onboarding.html"
      - "apps/demo-web/assets/cirvanna-sanctuary.css"
      - "apps/demo-web/assets/cirvanna-sanctuary.js"
      - "apps/demo-web/assets/cirvanna-twin-onboarding.css"
      - "apps/demo-web/assets/cirvanna-twin-onboarding.js"
      - ".github/workflows/marketplace-bff.yml"

permissions:
  contents: read

jobs:
  bff-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BFF test dependencies
        run: python -m pip install -r services/marketplace-bff/requirements.txt pytest
      - name: Test same-origin marketplace gateway
        working-directory: services/marketplace-bff
        run: python -m pytest -q
      - name: Compile BFF Python
        run: python -m compileall -q services/marketplace-bff/app
      - name: Validate Wardrobe style-profile controls and inline JavaScript
        run: python -m pytest apps/demo-web/test_wardrobe_style_profile.py -q
      - name: Validate shared appearance browser bundle
        run: node --check apps/demo-web/assets/appearance-workspace.js
      - name: Test shared Appearance portal integration
        run: python -m pytest -q apps/demo-web/test_portal_contract.py
