name: Marketplace BFF checks

on:
  pull_request:
    paths:
      - "services/marketplace-bff/**"
      - "apps/demo-web/marketplace.html"
      - "apps/demo-web/merchant-portal.html"
      - ".github/workflows/marketplace-bff.yml"
  push:
    branches: [main]
    paths:
      - "services/marketplace-bff/**"
      - "apps/demo-web/marketplace.html"
      - ".github/workflows/marketplace-bff.yml"

permissions:
  contents: read

jobs:
  bff-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BFF test dependencies
        run: python -m pip install -r services/marketplace-bff/requirements.txt pytest
      - name: Test same-origin marketplace gateway
        working-directory: services/marketplace-bff
        run: python -m pytest -q
      - name: Compile BFF Python
        run: python -m compileall -q services/marketplace-bff/app
