name: Wardrobe persistence service checks
on:
  push:
    branches: ["main", "feature/**", "engineering/**"]
    paths:
      - "services/wardrobe-service/**"
      - "packages/wardrobe/**"
      - ".github/workflows/wardrobe-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/wardrobe-service/**"
      - "packages/wardrobe/**"
      - ".github/workflows/wardrobe-service.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wardrobe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cirvanna_wardrobe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cirvanna_wardrobe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WARDROBE_TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/cirvanna_wardrobe_test
    defaults:
      run:
        working-directory: services/wardrobe-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/wardrobe-service/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile service and tests
        run: python -m compileall -q app tests
      - name: Run Wardrobe tests
        run: python -m pytest -q
