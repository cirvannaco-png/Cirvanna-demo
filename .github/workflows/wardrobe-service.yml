name: Wardrobe persistence service checks
on:
  push:
    branches: ["main", "feature/**", "engineering/**"]
    paths:
      - "services/wardrobe-service/**"
      - "packages/wardrobe/**"
      - ".github/workflows/wardrobe-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/wardrobe-service/**"
      - "packages/wardrobe/**"
      - ".github/workflows/wardrobe-service.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wardrobe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/wardrobe-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/wardrobe-service/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile service and tests
        run: python -m compileall -q app tests
      - name: Run Wardrobe tests
        run: python -m pytest -q
