name: Catalog service checks

on:
  push:
    branches: [main, "feature/catalog-service-foundation", "fix/catalog/**"]
    paths:
      - "services/catalog-service/**"
      - ".github/workflows/catalog-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/catalog-service/**"
      - ".github/workflows/catalog-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/catalog-service/requirements.txt
      - name: Install service dependencies
        run: python -m pip install -r services/catalog-service/requirements.txt
      - name: Run catalog API tests
        working-directory: services/catalog-service
        env:
          CATALOG_DATABASE_URL: sqlite://
          CATALOG_AUTO_CREATE_SCHEMA: "false"
          CATALOG_API_TOKEN: ci-test-token
        run: python -m pytest tests -q
