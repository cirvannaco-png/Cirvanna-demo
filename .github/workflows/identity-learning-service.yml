name: Identity and temporal learning checks
on:
  pull_request:
    paths:
      - "services/identity-learning-service/**"
      - ".github/workflows/identity-learning-service.yml"
  push:
    branches:
      - main
      - "integration/**"
      - "engineering/**"
      - "feature/**"
    paths:
      - "services/identity-learning-service/**"
      - ".github/workflows/identity-learning-service.yml"
permissions:
  contents: read
jobs:
  identity-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/identity-learning-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/identity-learning-service/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile service and tests
        run: python -m compileall -q app tests
      - name: Run USI and TAL regression tests
        run: python -m pytest -q
      - name: Start isolated PostgreSQL 17
        run: docker run -d --name cirvanna-identity-pg -e POSTGRES_USER=cirvanna -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB=cirvanna_identity -p 5432:5432 postgres:17
      - name: Apply identity migrations and verify legacy consent backfill
        shell: bash
        run: |
          for attempt in {1..40}; do
            if docker exec cirvanna-identity-pg pg_isready -U cirvanna -d cirvanna_identity; then break; fi
            sleep 1
          done
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0001_identity_tal.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0002_color_profile.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "INSERT INTO identity_tal_consent_receipts(receipt_id, subject_id, scope, consent_version, granted) VALUES ('legacy-consent-0001', 'legacy-user-0001', 'profile_storage', 'legacy-v1', true)"
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0003_resource_bound_media_consent.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0004_consent_expiry.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0005_pnelly_conversation_context.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0006_consent_revocation_outbox.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0007_dsi_capture_challenges.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "INSERT INTO identity_tal_consent_receipts(receipt_id, subject_id, consent_id, resource_id, scope, consent_version, granted, expires_at) VALUES ('legacy-skin-consent-0001', 'legacy-skin-user-0001', 'legacy-reused-skin-consent', 'legacy-skin-resource-0001', 'skin_analysis', 'skin-v1', true, now() + interval '10 minutes'), ('legacy-skin-consent-0002', 'legacy-skin-user-0002', 'legacy-reused-skin-consent', 'legacy-skin-resource-0002', 'skin_analysis', 'skin-v1', true, now() + interval '10 minutes')"
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0008_cil_provider_consent_revocation.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0009_foreign_key_indexes.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0010_runtime_role_grants.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0011_supabase_auth_app_role_hook.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < tests/verify_supabase_auth_hook.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM identity_tal_consent_receipts WHERE receipt_id='legacy-consent-0001' AND consent_id='legacy-consent-0001' AND resource_id IS NULL AND expires_at IS NULL) THEN RAISE EXCEPTION 'legacy consent backfill or null expiry preservation failed'; END IF; IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='identity_tal_consent_receipts' AND column_name='expires_at') THEN RAISE EXCEPTION 'consent expiry column missing'; END IF; IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='identity_tal_consent_receipts' AND column_name='provider_contributor_token') THEN RAISE EXCEPTION 'CIL contributor pseudonym column missing'; END IF; IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='identity_cil_provider_consent_revocation_outbox' AND column_name='revocation_receipt_id') THEN RAISE EXCEPTION 'CIL revocation event receipt column missing'; END IF; IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE indexname='uq_identity_skin_analysis_consent_id') THEN RAISE EXCEPTION 'unique skin-analysis consent index missing'; END IF; END \$\$;"
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "INSERT INTO identity_tal_consent_receipts(receipt_id, subject_id, consent_id, resource_id, scope, consent_version, granted, expires_at) VALUES ('resource-consent-0001', 'user-0001', 'bundle-0001', 'twin-0001', 'virtual_twin_storage', 'v1', true, now() + interval '1 day')"
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "INSERT INTO identity_tal_consent_receipts(receipt_id, subject_id, consent_id, resource_id, scope, consent_version, granted, expires_at) VALUES ('pnelly-consent-0001', 'user-0002', 'pnelly-conversation-0001', 'pnelly-conversation-0001', 'pnelly_conversation', 'pnelly-context-v1', true, now() + interval '1 day')"
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "INSERT INTO identity_pnelly_conversations(conversation_id, subject_id, consent_receipt_id, state_version, context, expires_at) VALUES ('pnelly-conversation-0001', 'user-0002', 'pnelly-consent-0001', 1, '{\"query\":\"green dress\",\"constraints\":[\"linen\"]}'::jsonb, now() + interval '1 day')"
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "INSERT INTO identity_consent_revocation_outbox(command_id, subject_id, consent_id, resource_id, receipt_id, status, attempts) VALUES ('twin-consent-revocation:ci-0001', 'user-0001', 'bundle-0001', 'twin-0001', 'resource-consent-0001', 'pending', 1)"
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "INSERT INTO identity_dsi_capture_challenges(challenge_id, subject_id, consent_id, consent_version, resource_id, purpose, required_scopes, consent_receipt_ids, nonce_sha256, created_at, expires_at, consumed_at, verification_receipt_id) VALUES ('dsi_challenge_ci_0001', 'user-0003', 'dsi-bundle-ci-0001', 'dsi-v1', 'dsi-resource-ci-0001', 'facial_geometry_analysis', '[\"image_processing\",\"facial_geometry_analysis\"]'::jsonb, '[\"dsi-image-consent-ci\",\"dsi-face-consent-ci\"]'::jsonb, repeat('e',64), now(), now() + interval '2 minutes', now(), 'dsi_receipt_ci_0001')"
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "INSERT INTO identity_dsi_capture_verification_receipts(receipt_id, challenge_id, subject_id, consent_id, consent_version, resource_id, purpose, consent_receipt_ids, manifest_sha256, image_sha256, device_pipeline_fingerprint_sha256, key_attestation_challenge_sha256, play_integrity_request_hash, package_name, package_certificate_sha256, app_version, sdk_version, verifier_policy_version, key_security_level, verified_boot_state, app_recognition_verdict, account_licensing_verdict, device_integrity_verdicts, issued_at, expires_at) VALUES ('dsi_receipt_ci_0001', 'dsi_challenge_ci_0001', 'user-0003', 'dsi-bundle-ci-0001', 'dsi-v1', 'dsi-resource-ci-0001', 'facial_geometry_analysis', '[\"dsi-image-consent-ci\",\"dsi-face-consent-ci\"]'::jsonb, repeat('a',64), repeat('b',64), repeat('c',64), repeat('e',64), repeat('a',64), 'com.cirvanna.app', repeat('d',64), '1.2.3', '0.1.0', 'dsi-policy-ci-v1', 'trusted_environment', 'verified', 'PLAY_RECOGNIZED', 'LICENSED', '[\"MEETS_DEVICE_INTEGRITY\"]'::jsonb, now(), now() + interval '90 seconds')"
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "INSERT INTO identity_tal_consent_receipts(receipt_id, subject_id, consent_id, resource_id, scope, consent_version, granted, expires_at, provider_contributor_token) VALUES ('skin-consent-ci-0001', 'skin-user-ci-0001', 'skin-bundle-ci-0001', 'skin-resource-ci-0001', 'skin_analysis', 'skin-v1', true, now() + interval '10 minutes', 'hmac-sha256:' || repeat('a',64))"
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "INSERT INTO identity_cil_provider_consent_revocation_outbox(command_id, revocation_receipt_id, consent_id, resource_id, receipt_id, contributor_token, status, attempts, matched_tasks, deleted_tasks, waiting_for_terminal) VALUES ('cil-provider-consent-revocation:ci-0001', 'skin-revoke-event-ci-0001', 'skin-bundle-ci-0001', 'skin-resource-ci-0001', 'skin-consent-ci-0001', 'hmac-sha256:' || repeat('a',64), 'pending', 1, 2, 1, 1)"
          if docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "INSERT INTO identity_tal_consent_receipts(receipt_id, subject_id, consent_id, resource_id, scope, consent_version, granted, expires_at, provider_contributor_token) VALUES ('skin-consent-ci-duplicate', 'another-skin-user-ci-0001', 'skin-bundle-ci-0001', 'skin-resource-ci-0002', 'skin_analysis', 'skin-v1', true, now() + interval '10 minutes', 'hmac-sha256:' || repeat('b',64))" >/dev/null 2>&1; then echo "duplicate active skin-analysis consent ID was accepted"; exit 1; fi
      - name: Verify PostgreSQL dump and isolated restore
        shell: bash
        run: |
          docker exec cirvanna-identity-pg pg_dump -U cirvanna -d cirvanna_identity --format=custom > /tmp/cirvanna-identity.dump
          docker exec cirvanna-identity-pg createdb -U cirvanna identity_restore
          docker exec -i cirvanna-identity-pg pg_restore -U cirvanna -d identity_restore --exit-on-error < /tmp/cirvanna-identity.dump
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d identity_restore -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM identity_tal_consent_receipts WHERE receipt_id='resource-consent-0001' AND consent_id='bundle-0001' AND resource_id='twin-0001' AND expires_at IS NOT NULL) THEN RAISE EXCEPTION 'restored resource-bound consent row missing'; END IF; IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='identity_tal_consent_receipts' AND column_name='consent_id') THEN RAISE EXCEPTION 'restored schema missing consent_id'; END IF; IF NOT EXISTS (SELECT 1 FROM identity_pnelly_conversations WHERE conversation_id='pnelly-conversation-0001' AND state_version=1 AND context->>'query'='green dress') THEN RAISE EXCEPTION 'restored PNELLY conversation context missing'; END IF; END \$\$;"
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d identity_restore -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM identity_consent_revocation_outbox WHERE command_id='twin-consent-revocation:ci-0001' AND status='pending' AND attempts=1) THEN RAISE EXCEPTION 'restored Twin consent cleanup outbox missing'; END IF; IF NOT EXISTS (SELECT 1 FROM identity_cil_provider_consent_revocation_outbox WHERE command_id='cil-provider-consent-revocation:ci-0001' AND revocation_receipt_id='skin-revoke-event-ci-0001' AND status='pending' AND attempts=1 AND matched_tasks=2 AND waiting_for_terminal=1) THEN RAISE EXCEPTION 'restored CIL provider consent cleanup outbox missing'; END IF; IF NOT EXISTS (SELECT 1 FROM identity_tal_consent_receipts WHERE receipt_id='skin-consent-ci-0001' AND provider_contributor_token='hmac-sha256:' || repeat('a',64)) THEN RAISE EXCEPTION 'restored CIL contributor pseudonym missing'; END IF; IF (SELECT count(*) FROM identity_tal_consent_receipts WHERE consent_id='legacy-reused-skin-consent' AND provider_contributor_token IS NULL) <> 2 THEN RAISE EXCEPTION 'restored legacy duplicate skin consent rows missing'; END IF; IF NOT EXISTS (SELECT 1 FROM identity_dsi_capture_challenges WHERE challenge_id='dsi_challenge_ci_0001' AND nonce_sha256=repeat('e',64) AND consumed_at IS NOT NULL) THEN RAISE EXCEPTION 'restored DSI capture challenge missing'; END IF; IF NOT EXISTS (SELECT 1 FROM identity_dsi_capture_verification_receipts WHERE receipt_id='dsi_receipt_ci_0001' AND manifest_sha256=repeat('a',64) AND image_sha256=repeat('b',64)) THEN RAISE EXCEPTION 'restored DSI verification receipt missing'; END IF; END \$\$;"
          docker exec -e PGOPTIONS=-csearch_path=identity_private cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity -c "DELETE FROM identity_consent_revocation_outbox WHERE command_id='twin-consent-revocation:ci-0001'"
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0008_cil_provider_consent_revocation.down.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0008_cil_provider_consent_revocation.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0007_dsi_capture_challenges.down.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0007_dsi_capture_challenges.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0006_consent_revocation_outbox.down.sql
          docker exec -e PGOPTIONS=-csearch_path=identity_private -i cirvanna-identity-pg psql -v ON_ERROR_STOP=1 -U cirvanna -d cirvanna_identity < migrations/0006_consent_revocation_outbox.sql
      - name: Build service container
        run: docker build -t cirvanna-identity-learning .
