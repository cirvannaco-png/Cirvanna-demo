name: Fashion retrieval evaluator

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "tools/model_evaluation/fashion_retrieval/**"
      - "tools/model_evaluation/fashion_retrieval/requirements-research-*.lock"
      - "tools/model_evaluation/fashion_retrieval/requirements-research-*.constraints.txt"
      - "tests/model_evaluation/**"
      - "services/vision-intelligence/app/retrieval_snapshot_export.py"
      - "services/vision-intelligence/README.md"
      - ".github/workflows/fashion-retrieval-evaluation.yml"
  push:
    branches: [main, "research/**"]
    paths:
      - "tools/model_evaluation/fashion_retrieval/**"
      - "tools/model_evaluation/fashion_retrieval/requirements-research-*.lock"
      - "tools/model_evaluation/fashion_retrieval/requirements-research-*.constraints.txt"
      - "tests/model_evaluation/**"
      - "services/vision-intelligence/app/retrieval_snapshot_export.py"
      - "services/vision-intelligence/README.md"
      - ".github/workflows/fashion-retrieval-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluator contract dependencies
        run: python -m pip install --upgrade pip pillow numpy==2.2.6
      - name: Compile evaluator and model runner
        run: |
          python -m py_compile tools/model_evaluation/fashion_retrieval/evaluate_retrieval.py
          python -m py_compile tools/model_evaluation/fashion_retrieval/run_retrieval.py
          python -m py_compile tools/model_evaluation/fashion_retrieval/data_rights.py
          python -m py_compile tools/model_evaluation/fashion_retrieval/prepare_cases.py
          python -m py_compile tools/model_evaluation/fashion_retrieval/build_qrels.py
          python -m py_compile services/vision-intelligence/app/retrieval_snapshot_export.py
      - name: Run evaluator and runner contract tests
        run: python -m unittest discover -s tests/model_evaluation -v
      - name: Validate evaluator and runner CLIs
        run: |
          python tools/model_evaluation/fashion_retrieval/evaluate_retrieval.py --help
          python tools/model_evaluation/fashion_retrieval/run_retrieval.py --help
          python tools/model_evaluation/fashion_retrieval/prepare_cases.py --help
          python tools/model_evaluation/fashion_retrieval/build_qrels.py --help
          python services/vision-intelligence/app/retrieval_snapshot_export.py --help


  locked-cpu-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install hash-locked CPU research environment
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/model_evaluation/fashion_retrieval/requirements-research-py311-linux-x86_64-cpu.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify pinned model-runtime packages
        run: |
          python -c 'from importlib.metadata import version; import open_clip, torch, torchvision, transformers; assert torch.__version__ == "2.7.0+cpu"; assert torchvision.__version__ == "0.22.0+cpu"; assert version("open_clip_torch") == "4.2.2"; assert transformers.__version__ == "4.57.6"; assert not torch.cuda.is_available(); print("Hash-locked CPU model runtime imports and version checks passed.")'
