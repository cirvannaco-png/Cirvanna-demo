name: Privacy Governance Service checks

on:
  pull_request:
    paths:
      - "services/privacy-governance-service/**"
      - ".github/workflows/privacy-governance-service.yml"
  push:
    branches: [main]
    paths:
      - "services/privacy-governance-service/**"
      - ".github/workflows/privacy-governance-service.yml"

permissions:
  contents: read

jobs:
  privacy-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: privacy
          POSTGRES_PASSWORD: privacy
          POSTGRES_DB: privacy_governance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacy -d privacy_governance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/privacy-governance-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/privacy-governance-service/requirements.txt
      - name: Install service dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Apply PostgreSQL migration and verify mapped schema
        env:
          PRIVACY_GOVERNANCE_DATABASE_URL: postgresql+psycopg://privacy:privacy@localhost:5432/privacy_governance
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy import inspect
          from app.main import Base, _engine

          database_url = os.environ["PRIVACY_GOVERNANCE_DATABASE_URL"]
          with psycopg.connect(database_url.replace("postgresql+psycopg://", "postgresql://")) as connection:
              connection.execute(open("migrations/0001_privacy_governance.sql", encoding="utf-8").read(), prepare=False)
              connection.commit()

          engine = _engine(database_url)
          inspector = inspect(engine)
          for table_name, model_table in Base.metadata.tables.items():
              actual = {column["name"] for column in inspector.get_columns(table_name)}
              expected = {column.name for column in model_table.columns}
              missing = expected - actual
              if missing:
                  raise SystemExit(f"{table_name}: migration missing columns {sorted(missing)}")
          print("PostgreSQL migration applied; mapped model columns verified.")
          PY
      - name: Compile service and tests
        run: python -m compileall -q app tests
      - name: Run privacy governance contract tests
        run: python -m pytest -q
