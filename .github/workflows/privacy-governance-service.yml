name: Privacy Governance Service checks

on:
  pull_request:
    paths:
      - "services/privacy-governance-service/**"
      - ".github/workflows/privacy-governance-service.yml"
  push:
    branches: [main]
    paths:
      - "services/privacy-governance-service/**"
      - ".github/workflows/privacy-governance-service.yml"

permissions:
  contents: read

jobs:
  privacy-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/privacy-governance-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/privacy-governance-service/requirements.txt
      - name: Install service dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile service and tests
        run: python -m compileall -q app tests
      - name: Run privacy governance contract tests
        run: python -m pytest -q
