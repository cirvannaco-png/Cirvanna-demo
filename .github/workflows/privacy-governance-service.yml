name: Privacy Governance Service checks

on:
  pull_request:
    paths:
      - "services/**"
      - "apps/**"
      - "infrastructure/deployment/canonical-stack.json"
      - "infrastructure/deployment/media-delivery-inventory.json"
      - ".github/workflows/privacy-governance-service.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "apps/**"
      - "infrastructure/deployment/canonical-stack.json"
      - "infrastructure/deployment/media-delivery-inventory.json"
      - ".github/workflows/privacy-governance-service.yml"

permissions:
  contents: read

jobs:
  privacy-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: privacy
          POSTGRES_PASSWORD: privacy
          POSTGRES_DB: privacy_governance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacy -d privacy_governance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/privacy-governance-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/privacy-governance-service/requirements.txt
      - name: Install service dependencies
        run: python -m pip install -r requirements.txt
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Check dependency consistency
        run: python -m pip check
      - name: Apply PostgreSQL migration and verify mapped schema
        env:
          PRIVACY_GOVERNANCE_DATABASE_URL: postgresql+psycopg://privacy:privacy@localhost:5432/privacy_governance
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy import inspect
          from app.main import Base, _engine

          database_url = os.environ["PRIVACY_GOVERNANCE_DATABASE_URL"]
          with psycopg.connect(database_url.replace("postgresql+psycopg://", "postgresql://")) as connection:
              connection.execute(open("migrations/0001_privacy_governance.sql", encoding="utf-8").read(), prepare=False)
              connection.commit()

          engine = _engine(database_url)
          inspector = inspect(engine)
          for table_name, model_table in Base.metadata.tables.items():
              actual = {column["name"] for column in inspector.get_columns(table_name)}
              expected = {column.name for column in model_table.columns}
              missing = expected - actual
              if missing:
                  raise SystemExit(f"{table_name}: migration missing columns {sorted(missing)}")
          print("PostgreSQL migration applied; mapped model columns verified.")
          PY
      - name: Seed a representative privacy consent record
        env:
          PGPASSWORD: privacy
        run: |
          psql -h localhost -U privacy -d privacy_governance -v ON_ERROR_STOP=1 -c "INSERT INTO privacy_consent_records (consent_id, subject_id, resource_id, granted_scopes, photographed_people_status, consent_version, active) VALUES ('restore-consent-ci-0001', 'restore-subject-ci-0001', 'restore-click-it-ci-0001', '[\"image_processing\",\"click_it\"]'::jsonb, 'no_people', 'click-it-ci-v1', true)"
      - name: Verify privacy PostgreSQL dump and isolated restore
        env:
          PGPASSWORD: privacy
        run: |
          docker run --rm --network host -v /tmp:/backup -e PGPASSWORD=privacy postgres:17 bash -ec 'pg_dump -h 127.0.0.1 -U privacy -d privacy_governance --format=custom -f /backup/cirvanna-privacy.dump && createdb -h 127.0.0.1 -U privacy privacy_restore && pg_restore -h 127.0.0.1 -U privacy -d privacy_restore --exit-on-error /backup/cirvanna-privacy.dump'
          psql -h localhost -U privacy -d privacy_restore -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM privacy_consent_records WHERE consent_id='restore-consent-ci-0001' AND subject_id='restore-subject-ci-0001' AND resource_id='restore-click-it-ci-0001' AND active=true) THEN RAISE EXCEPTION 'privacy consent record missing after restore'; END IF; IF to_regclass('public.privacy_image_rights_cases') IS NULL THEN RAISE EXCEPTION 'image-rights table missing after restore'; END IF; IF to_regclass('public.privacy_governance_audit_events') IS NULL THEN RAISE EXCEPTION 'privacy audit table missing after restore'; END IF; END \$\$;"
      - name: Compile service and tests
        run: python -m compileall -q app tests
      - name: Run privacy governance contract tests
        run: python -m pytest -q
